<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{field}}">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
{{fontPreloads}}
<style>{{fontFaces}}</style>
<link rel="stylesheet" href="/about/v7/letters.css?v={{styleHash}}">
<script src="/about/v7/letters.js?v={{scriptHash}}" defer></script>
</head>
<body class="about-v7">
<main class="letters-stage" data-letters-stage>
  <canvas class="letters-canvas" data-letters-canvas aria-hidden="true"></canvas>
  <a class="letters-home" href="/?from=post">Home</a>
  <nav class="letters-versions" aria-label="Versions of this page">
    <p>Version 7. Also: <a href="/about/">first draft</a>, <a href="/about/v1/" aria-label="version 1">1</a>, <a href="/about/v2/" aria-label="version 2">2</a>, <a href="/about/v3/" aria-label="version 3">3</a>, <a href="/about/v4/" aria-label="version 4">4</a>, <a href="/about/v5/" aria-label="version 5">5</a>, <a href="/about/v6/" aria-label="version 6">6</a></p>
  </nav>
  <div class="letters-title" data-letters-title>
    <h1 class="letters-name">{{nameLines}}</h1>
    <p class="letters-bio">{{bio}}</p>
  </div>
  <noscript><p class="letters-plain">This version needs its script. <a href="/about/">The About page</a> reads without one.</p></noscript>
</main>
</body>
</html>
