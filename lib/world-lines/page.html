<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
{{shareMeta}}
{{fontPreloads}}
<style>{{fontFaces}}</style>
<link rel="stylesheet" href="/about/v4/world-lines.css?v={{styleHash}}">
<script src="/about/v4/world-lines.js?v={{scriptHash}}" defer></script>
</head>
<body class="about-v4">
<main class="lines-stage" data-lines-stage {{stageArt}}>
  <a class="lines-home" href="/?from=post">Home</a>
  <nav class="lines-versions" aria-label="Versions of this page">
    <p>Version 4. Also: <a href="/about/">first draft</a>, <a href="/about/v1/" aria-label="version 1">1</a>, <a href="/about/v2/" aria-label="version 2">2</a>, <a href="/about/v3/" aria-label="version 3">3</a></p>
  </nav>
  {{haze}}
  <canvas class="lines-canvas" data-lines-canvas aria-hidden="true"></canvas>
  {{still}}
  <div class="lines-title" data-lines-title>
    <h1 class="lines-name">{{name}}</h1>
    <p class="lines-bio">{{bio}}</p>
  </div>
  <noscript><p class="lines-plain">This version needs its script. <a href="/about/">The About page</a> reads without one.</p></noscript>
</main>
</body>
</html>
