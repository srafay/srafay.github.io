<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="{{helloField}}">
<meta name="description" content="{{description}}">
<title>{{title}}</title>
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
{{fontPreloads}}
<style>{{fontFaces}}</style>
<style>{{fieldStyles}}</style>
<link rel="stylesheet" href="/about/v6/guide.css?v={{styleHash}}">
<script src="/about/v6/guide.js?v={{scriptHash}}" defer></script>
</head>
<body class="about-v6" data-guide-root data-under-top="hello" data-under-bottom="hello" data-under-python="hello" data-guide-art="{{art}}">
<header class="guide-top" data-guide-top>
  <a class="guide-home" href="/?from=post">Home</a>
  <div class="guide-top-right" data-guide-top-controls></div>
  <nav class="guide-versions" aria-label="Versions of this page">
    <p>Version 6. Also: <a href="/about/">first draft</a>, <a href="/about/v1/" aria-label="version 1">1</a>, <a href="/about/v2/" aria-label="version 2">2</a>, <a href="/about/v3/" aria-label="version 3">3</a>, <a href="/about/v4/" aria-label="version 4">4</a>, <a href="/about/v5/" aria-label="version 5">5</a></p>
  </nav>
</header>
<main class="guide-tour" data-guide-tour>
  <section class="guide-section guide-field-hello guide-hello" data-section="hello" aria-labelledby="guide-name">
    <h1 class="guide-name" id="guide-name">{{nameLines}}</h1>
    <p class="guide-bio">{{bio}}</p>
    <div class="guide-hello-chat" data-guide-hello-chat></div>
  </section>
  <noscript><p class="guide-plain">This version needs its script. <a href="/about/">The About page</a> reads without one.</p></noscript>
</main>
<div class="guide-python" data-guide-python>
  <canvas class="guide-canvas" data-guide-canvas aria-hidden="true"></canvas>
</div>
<div class="guide-bottom" data-guide-bottom></div>
</body>
</html>
